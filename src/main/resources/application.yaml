server:
  port: 8081

spring:
  application:
    name: smart-life-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/smartlife?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 如需密码请通过环境变量 SPRING_DATA_REDIS_PASSWORD 注入
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  ai:
    openai:
      # 兼容 OpenAI 协议的任意模型服务：DeepSeek / 通义千问 / OpenAI 等
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
    mcp:
      server:
        name: smartlife-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "智慧生活服务平台 MCP Server：提供商户搜索、优惠券查询、订单查询、评论分析等工具"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartlife.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5

smartlife:
  jwt:
    # 生产环境务必通过环境变量注入至少 256 位的密钥
    secret: ${JWT_SECRET:smartlife-jwt-secret-please-change-me-in-production-0123456789}
    ttl-minutes: 30
  cache:
    local:
      maximum-size: 10000
      expire-seconds: 30

logging:
  level:
    com.smartlife: debug
    org.springframework.ai: info
