worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 后端集群：多实例负载均衡（L1 本地缓存失效通过 Redis Pub/Sub 广播保证一致）
    upstream smartlife_backend {
        least_conn;
        server app1:8081 max_fails=3 fail_timeout=10s;
        server app2:8081 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # 接口限流：单 IP 100 QPS，秒杀等突发流量在网关层先削一层峰
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://smartlife_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # MCP SSE 长连接：关闭缓冲、延长读超时
        location /api/sse {
            proxy_pass http://smartlife_backend/sse;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}
